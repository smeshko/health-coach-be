# Alembic configuration.
#
# There is deliberately NO `sqlalchemy.url` here: the migration database URL is
# owned by `env.py`, derived from `settings.app_db_path`, so a stale value in this
# file can never redirect a migration to the wrong database (round-1 #2). The only
# override is the explicit test-only `config.attributes["test_db_url"]`.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
