[project]
name = "health-coach-be"
version = "0.1.0"
description = "Coach App backend — FastAPI workflow engine for health-coaching briefs."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    # Claude-only surface: the slim package with just the Anthropic extra, so the
    # lock stays free of other providers + worker libs (Temporal/MCP/boto3/…) that
    # the full `pydantic-ai` meta-package pulls in (ARCHITECTURE §1 kept stack).
    "pydantic-ai-slim[anthropic]>=1.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
