<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Coach App · Implementation Epics</title>
<!-- set theme before first paint to avoid a flash; key shared with the plan viewers -->
<script>(function(){try{var p=localStorage.getItem("md-viewer-theme")||"system";var light=p==="light"||(p==="system"&&window.matchMedia("(prefers-color-scheme: light)").matches);document.documentElement.setAttribute("data-theme",light?"light":"dark");}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e13; --panel:#0f151d; --panel-2:#131c26; --panel-3:#172230;
  --line:#1e2a37; --line-bright:#2c3d4f;
  --ink:#dce5ef; --ink-dim:#8a98a9; --ink-faint:#566372;
  --green:#3ad6a0; --amber:#f3b54a; --red:#ef6d6d;
  --blue:#5fa8e0; --violet:#b08cf0; --steel:#85aacb;
  --grid:rgba(120,160,200,.045);
  --f-disp:'Archivo',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --sidebar:300px;
}
/* ── Light theme — applied when <html data-theme="light"> (set by the toggle / system pref) ── */
:root[data-theme="light"]{
  --bg:#f3f6f9; --panel:#ffffff; --panel-2:#eaf0f5; --panel-3:#dde6ee;
  --line:#d6dee7; --line-bright:#bcc8d4;
  --ink:#1a2430; --ink-dim:#55657a; --ink-faint:#8593a4;
  --green:#0e9d6e; --amber:#bf7d12; --red:#d2433f;
  --blue:#2f7ec4; --violet:#7a4fd0; --steel:#48657f;
  --grid:rgba(40,80,130,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;
  color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; display:flex; min-height:100%;
}
a{color:var(--green);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:var(--f-mono)}
em{color:var(--ink-dim);font-style:normal}

/* ── Sidebar ─────────────────────────────────────────── */
aside{
  width:var(--sidebar); flex:0 0 var(--sidebar); position:sticky; top:0; height:100vh;
  border-right:1px solid var(--line); background:linear-gradient(180deg,var(--panel),var(--bg));
  display:flex; flex-direction:column; padding:22px 18px; gap:16px; z-index:5;
}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .kick{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--green)}
.brand h1{font-family:var(--f-disp);font-weight:900;font-size:20px;letter-spacing:-.01em;margin:0;line-height:1.05}
.brand .sub{font-size:11.5px;color:var(--ink-faint);font-family:var(--f-mono)}
nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;margin:0 -6px;padding:0 6px}
nav button{
  all:unset; cursor:pointer; display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:7px;
  color:var(--ink-dim); font-size:13.5px; transition:.14s;
}
nav button .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-faint);min-width:26px}
nav button:hover{background:var(--panel-2);color:var(--ink)}
nav button.active{background:var(--panel-3);color:var(--ink)}
nav button.active .n{color:var(--green)}
nav button .ph{margin-left:auto;font-family:var(--f-mono);font-size:10px;color:var(--ink-faint);
  border:1px solid var(--line-bright);border-radius:10px;padding:1px 7px}
nav .navgap{height:1px;background:var(--line);margin:8px 4px}

.legend{border-top:1px solid var(--line);padding-top:13px;display:flex;flex-direction:column;gap:8px}
.legend .lt{font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint)}
.legend .row{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink-dim)}
.legend .pill{font-family:var(--f-mono);font-size:9.5px;font-weight:700;border-radius:20px;padding:2px 9px;letter-spacing:.04em}

/* ── Main ────────────────────────────────────────────── */
main{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow:auto;scroll-behavior:smooth}
.section{display:none;max-width:1000px;margin:0 auto;padding:44px 54px 100px}
.section.active{display:block;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.shead{display:flex;align-items:flex-start;gap:20px;margin-bottom:30px;border-bottom:1px solid var(--line);padding-bottom:22px}
.shead .idx{font-family:var(--f-disp);font-weight:900;font-size:58px;line-height:.8;color:var(--panel-3);-webkit-text-stroke:1px var(--line-bright);letter-spacing:-.03em;white-space:nowrap}
.shead .meta{padding-top:2px;flex:1}
.shead .kick{font-family:var(--f-mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--green);margin-bottom:7px}
.shead h2{font-family:var(--f-disp);font-weight:800;font-size:29px;margin:0 0 8px;letter-spacing:-.02em}
.shead p{margin:0;color:var(--ink-dim);font-size:14.5px;max-width:66ch}

h3{font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin:34px 0 14px;color:var(--ink-dim);
  display:flex;align-items:center;gap:10px}
h3::before{content:"";width:8px;height:8px;background:var(--green);border-radius:2px;transform:rotate(45deg);flex:0 0 auto}

/* ── pills / badges ──────────────────────────────────── */
.pill{font-family:var(--f-mono);font-size:9.5px;font-weight:700;border-radius:20px;padding:2px 9px;letter-spacing:.04em;white-space:nowrap}
.pill.ready{background:rgba(95,168,224,.16);color:var(--blue);border:1px solid rgba(95,168,224,.4)}
.pill.prog{background:rgba(243,181,74,.16);color:var(--amber);border:1px solid rgba(243,181,74,.4)}
.pill.done{background:rgba(58,214,160,.16);color:var(--green);border:1px solid rgba(58,214,160,.4)}
.tag{font-family:var(--f-mono);font-size:10px;color:var(--steel);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.dep{font-family:var(--f-mono);font-size:10.5px;color:var(--violet)}

/* ── overview grid ───────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:6px 0 8px}
.stat{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:11px;padding:16px 18px}
.stat .v{font-family:var(--f-disp);font-weight:900;font-size:34px;line-height:1;color:var(--ink)}
.stat .l{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:8px}

.egrid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px;margin-top:6px}
.ecard{all:unset;cursor:pointer;background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:16px 17px;transition:.15s;display:flex;flex-direction:column;gap:9px}
.ecard:hover{border-color:var(--green);transform:translateY(-2px)}
.ecard .top{display:flex;align-items:center;gap:10px}
.ecard .code{font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--green);background:rgba(58,214,160,.1);border:1px solid rgba(58,214,160,.3);border-radius:6px;padding:2px 8px}
.ecard h4{font-family:var(--f-disp);font-weight:700;font-size:15.5px;margin:0;letter-spacing:-.01em;flex:1}
.ecard p{margin:0;color:var(--ink-dim);font-size:12.5px;line-height:1.5}
.ecard .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px;flex-wrap:wrap}

.note{background:rgba(95,168,224,.06);border:1px solid rgba(95,168,224,.28);border-left:3px solid var(--blue);
  border-radius:8px;padding:13px 16px;font-size:13.5px;color:var(--ink-dim);margin:18px 0}
.note b{color:var(--ink)}

/* ── phase list ──────────────────────────────────────── */
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 8px}
.phase{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:11px;padding:0;margin:0 0 12px;overflow:hidden}
.phase .ph-head{display:flex;align-items:center;gap:13px;padding:14px 17px;border-bottom:1px solid var(--line);background:var(--panel-3)}
.phase .pn{font-family:var(--f-disp);font-weight:900;font-size:13px;color:var(--bg);background:var(--green);border-radius:6px;padding:3px 8px;letter-spacing:.02em;white-space:nowrap}
.phase .pt{font-family:var(--f-disp);font-weight:700;font-size:15.5px;flex:1;letter-spacing:-.01em}
.phase .pb{padding:14px 17px 16px}
.phase .pb .deliver{font-size:13.5px;color:var(--ink);margin:0 0 12px}
.phase .lblk{margin:11px 0 0}
.phase .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
.phase ul{margin:0;padding-left:18px}
.phase li{font-size:13px;color:var(--ink-dim);margin:3px 0}
.phase li code{font-size:11.5px;color:var(--steel);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.phase .refs{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.phase .ref{font-family:var(--f-mono);font-size:10.5px;color:var(--steel);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:2px 8px}

.epic-meta{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:4px 0 8px}
.epic-meta .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.epic-meta .box .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px}
.epic-meta .box ul{margin:0;padding-left:17px}
.epic-meta .box li{font-size:13px;color:var(--ink-dim);margin:4px 0}
.epic-meta .box p{margin:0;font-size:13px;color:var(--ink-dim)}
.epic-meta .box .dep{display:inline-block;margin:2px 6px 2px 0}

.foot-nav{display:flex;justify-content:space-between;margin-top:40px;border-top:1px solid var(--line);padding-top:20px}
.foot-nav button{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--ink-dim);border:1px solid var(--line-bright);border-radius:8px;padding:9px 15px;transition:.14s}
.foot-nav button:hover{border-color:var(--green);color:var(--ink)}
.foot-nav button:disabled{opacity:.3;cursor:default}
/* ── Sidebar accordion (epic groups → plan viewers) ──── */
.navgroup{display:flex;flex-direction:column}
.ghead{display:flex;align-items:center;gap:2px}
.ghead .glabel{flex:1}
.gtoggle{all:unset;cursor:pointer;width:22px;height:30px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:10px;transition:.15s;border-radius:6px}
.gtoggle:hover{color:var(--ink);background:var(--panel-2)}
.gtoggle.open{transform:rotate(90deg);color:var(--green)}
.gtoggle.spacer{cursor:default;visibility:hidden}
.gsub{display:none;flex-direction:column;gap:1px;margin:1px 0 4px 14px;
  padding-left:8px;border-left:1px solid var(--line)}
.gsub.open{display:flex}
.subitem{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;
  color:var(--ink-faint);font-size:12.5px;transition:.13s}
.subitem:hover{background:var(--panel-2);color:var(--ink)}
.subitem.active{background:var(--panel-3);color:var(--ink)}
.subitem .pn{font-family:var(--f-mono);font-size:9.5px;font-weight:700;color:var(--bg);background:var(--steel);
  border-radius:4px;padding:1px 5px;flex:0 0 auto}
.subitem.active .pn{background:var(--green)}
.subitem .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subitem .rc{font-family:var(--f-mono);font-size:9px;color:var(--ink-faint)}
nav button.haskids .ph{background:rgba(58,214,160,.14);color:var(--green);border-color:rgba(58,214,160,.4)}

/* ── Plan viewer (iframe) view ───────────────────────── */
.planview{display:none;flex:1;min-height:0;flex-direction:column}
body.viewing .scroll{display:none}
body.viewing .planview{display:flex}
.planbar{display:flex;align-items:center;gap:14px;padding:11px 18px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--panel-2),var(--panel));flex:0 0 auto}
.planbar .bk{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-dim);
  border:1px solid var(--line-bright);border-radius:7px;padding:6px 12px;transition:.14s}
.planbar .bk:hover{border-color:var(--green);color:var(--ink)}
.planbar .pcode{font-family:var(--f-mono);font-size:10px;font-weight:700;color:var(--bg);background:var(--green);
  border-radius:5px;padding:2px 8px}
.planbar .ttl{font-family:var(--f-disp);font-weight:700;font-size:15px;color:var(--ink)}
.planbar .meta{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-faint)}
.planbar .open-new{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:10.5px;color:var(--steel)}
.planbar .open-new:hover{color:var(--green)}
.planframe{flex:1;width:100%;border:0;background:var(--bg)}

/* per-phase "open plan" button on the epic page */
.phase .ph-head .ph-open{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:10.5px;font-weight:700;
  color:var(--green);background:rgba(58,214,160,.1);border:1px solid rgba(58,214,160,.35);border-radius:6px;
  padding:4px 10px;transition:.14s;white-space:nowrap}
.phase .ph-head .ph-open:hover{background:var(--green);color:var(--bg)}
.phase .ph-head .ph-novalid{font-family:var(--f-mono);font-size:10px;color:var(--ink-faint)}
.ecard .plans-tag{font-family:var(--f-mono);font-size:10px;color:var(--green);background:rgba(58,214,160,.1);
  border:1px solid rgba(58,214,160,.3);border-radius:10px;padding:1px 8px;font-weight:700}

@media(max-width:880px){.egrid,.epic-meta,.stats{grid-template-columns:1fr 1fr}.section{padding:30px 22px 80px}}
/* theme segmented control (dark / light / system) */
.seg{display:flex;border:1px solid var(--line-bright);border-radius:7px;overflow:hidden}
.seg button{all:unset;cursor:pointer;flex:1;text-align:center;padding:7px 4px;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.02em;color:var(--ink-dim);transition:.14s}
.seg button + button{border-left:1px solid var(--line-bright)}
.seg button:hover{background:var(--panel-2);color:var(--ink)}
.seg button.on{background:var(--green);color:#04130d;font-weight:700}
</style>
</head>
<body>
<aside>
  <div class="brand">
    <div class="kick">Coach App · Backend</div>
    <h1>Implementation Epics</h1>
    <div class="sub">12 epics · 36 phases</div>
  </div>
  <nav id="nav"></nav>
  <div class="legend">
    <div class="lt">Status</div>
    <div class="row"><span class="pill ready">ready for dev</span></div>
    <div class="row"><span class="pill prog">in progress</span></div>
    <div class="row"><span class="pill done">done</span></div>
    <div class="row" style="margin-top:4px"><span class="gtoggle open" style="position:static;width:auto">▸</span><span>expand an epic for its validated plans</span></div>
  </div>
  <div class="seg" id="themeSeg" role="group" aria-label="Theme (press T to cycle)">
    <button data-theme-choice="light" title="Light theme (T)">light</button>
    <button data-theme-choice="dark" title="Dark theme (T)">dark</button>
    <button data-theme-choice="system" title="Match system (T)">auto</button>
  </div>
</aside>
<main>
  <div class="scroll" id="scroll"></div>
  <div class="planview" id="planview">
    <div class="planbar">
      <button class="bk" id="planback">← back to epic</button>
      <span class="pcode" id="plancode"></span>
      <span class="ttl" id="plantitle"></span>
      <span class="meta" id="planmeta"></span>
      <a class="open-new" id="planopen" href="#" target="_blank" rel="noopener">open in new tab ↗</a>
    </div>
    <iframe class="planframe" id="planframe" title="plan viewer"></iframe>
  </div>
</main>

<script>
const EPICS = [
  {
    code:"E1", title:"Foundation & API Skeleton", status:"ready",
    blurb:"The bedrock everything sits on — the FastAPI app, config, auth, the error envelope, and the kept Launchpad workflow primitives.",
    goal:"A runnable, authenticated FastAPI process with the Node/Router/Agent workflow engine in place — no business logic yet.",
    refs:["ARCHITECTURE §1","ARCHITECTURE §5","MODELS · Errors"],
    deps:["—"],
    outcome:"`uvicorn` boots; an authed health check returns 200; a trivial workflow runs end-to-end over a shared TaskContext.",
    phases:[
      {t:"Project scaffold & config", deliver:"Initialise the `uv` project, FastAPI app entry, typed settings/config, and the directory layout (`api/`, `core/`, `database/`, `services/`).",
        items:["`uv` project + pinned Python 3.13","FastAPI + `uvicorn` app factory","Settings via env (token, DB path, model, Langfuse keys)","camelCase Pydantic base (`alias_generator`)"],
        refs:["ARCHITECTURE §1 (Components)","ARCHITECTURE §1 (stack note: keep FastAPI/core/PydanticAI/Jinja2/Alembic; drop Postgres/Celery/Redis/RAG)"]},
      {t:"Auth, error envelope & health", deliver:"Single long-lived bearer-token auth dependency, the one error envelope for all non-2xx, and a health endpoint.",
        items:["Bearer token in `Authorization` header (single user, no tenancy)","`Error { code, message, detail }` envelope + handlers","Stable codes: `validation_error`, `unauthorized`, `not_found`, `brief_generation_failed`, `upstream_timeout`, `internal_error`","`GET /health`"],
        refs:["MODELS · Errors","MODELS · Conventions (Auth)"]},
      {t:"Workflow engine primitives", deliver:"Adopt and verify the Launchpad `core/` primitives — `Node`, `RouterNode`, `AgentNode`, `TaskContext` — with `stop_workflow()` and unit tests.",
        items:["DAG runner over a shared Pydantic `TaskContext`","`Node` / `RouterNode` / `AgentNode` base types","`stop_workflow()` short-circuit","Tests: linear flow, router branch, early stop"],
        refs:["ARCHITECTURE §1 (Orchestration)","ARCHITECTURE §5 (node legend)","LLM §0"]},
      {t:"Local dev runner (justfile)", deliver:"A `justfile` of turnkey local-dev recipes so the app runs without Docker (deployment-only, E12) and without memorising commands.",
        items:["Core recipes: `install` (uv sync), `run` (uvicorn --reload), `test`, `lint`, `fmt`; bare `just` lists recipes","Forward recipes that light up later: `migrate` (E2), `seed` (E4), `bootstrap`, `db-reset`","`.env.example` + a README \"Local development\" section","No Docker / litestream / migrate-on-startup (those stay in E12)"],
        refs:["ARCHITECTURE §1 (single uvicorn process; Docker is E12)","E1·P1 run convention (`uv run uvicorn app.main:app`)"]},
    ]
  },
  {
    code:"E2", title:"Persistence Layer (app.db)", status:"ready",
    blurb:"SQLAlchemy + Alembic + WAL, and all nine tables of the runtime database — ingest, derived cache, and coaching state.",
    goal:"A migrated, WAL-mode `app.db` with every table from DB.md, owned by Alembic and never dropped.",
    refs:["DB.md §0–§4","ARCHITECTURE §3"],
    deps:["E1"],
    outcome:"`alembic upgrade head` builds a 9-table `app.db`; models round-trip; constraints (unique `uuid`, unique period keys) hold.",
    phases:[
      {t:"DB engine, WAL & Alembic init", deliver:"SQLAlchemy engine/session, WAL pragmas, ISO-8601 TEXT timestamp convention, Europe/Sofia period-key helpers, and Alembic wired up.",
        items:["SQLite WAL engine + session factory","Alembic env targeting `app.db` only (never `baseline.db`)","Period-key helpers via Europe/Sofia tz database (DST-aware)","Timestamps stored as TEXT with the offset HealthKit emits"],
        refs:["DB.md §0","ARCHITECTURE §4 (period key & timezone)"]},
      {t:"Ingest tables", deliver:"Models + migration for `records`, `workouts`, `workout_statistics`, `activity_summary` — mirroring `baseline.db` plus `uuid`/`origin`.",
        items:["`records` (UNIQUE `uuid`, indexes on `(type,start_date)`,`(start_date)`)","`workouts` (UNIQUE `uuid`, `effort_score`, `physical_effort`)","`workout_statistics` (FK → workouts, `(workout_id,type)`)","`activity_summary` (PK `date`)"],
        refs:["DB.md §1","ARCHITECTURE §3 (ingest)"]},
      {t:"Derived & coaching-state tables", deliver:"Models + migration for `daily_metrics`, `checkins`, `strength_tests`, `plans`, `suggestions`.",
        items:["`daily_metrics` (PK date; sleep/HRV/RHR, 30d mean+SD, zone-min, nutrition, body_weight, readiness, band)","`checkins` (PK date; gi/illness/knee)","`strength_tests` (UNIQUE `iso_week`)","`plans` (UNIQUE `iso_week`) · `suggestions` (UNIQUE `date`) with `payload`/`inputs_snapshot`"],
        refs:["DB.md §2","DB.md §3","DB.md §4"]},
    ]
  },
  {
    code:"E3", title:"Profile & Constitution", status:"ready",
    blurb:"profile.yaml as the single source of every numeric constant, and the Jinja2-rendered constitution that reads from it.",
    goal:"A typed loader for profile.yaml and a renderer that fills the constitution template's `{{ }}` placeholders so the rulebook can never drift.",

      <div class="meta">
        <div class="kick">Epic ${e.code} · <span style="color:var(--ink-faint)">${STATUS_LABEL[e.status]}</span></div>

        <p>${e.outcome}</p>
      </div>
      <div class="box">
        <div class="lbl">Depends On</div>
        <p>${e.deps.map(d=>`<span class="dep">${d}</span>`).join(' · ')}</p>
      </div>
      <div class="box">
        <div class="lbl">Primary References</div>
        <p>${e.refs.map(r=>`<span class="ref">${r}</span>`).join(' ')}</p>
      </div>
    </div>
    <h3>Phases (${e.phases.length})</h3>
    ${phases}
    <div class="foot-nav">
      <button data-go="${i}" ${i===0?'':''}>← ${i===0?'Overview':EPICS[i-1].code+' '+EPICS[i-1].title}</button>
      <button data-go="${i+2}" ${i+1>=EPICS.length?'disabled':''}>${i+1<EPICS.length?EPICS[i+1].code+' '+EPICS[i+1].title+' →':''}</button>
    </div>
  </section>`;
}

// ── Render ─────────────────────────────────────────────
scroll.innerHTML = overviewHTML() + EPICS.map(epicHTML).join('');

nav.innerHTML =
  `<button data-go="0" class="active"><span class="n">00</span><span>Overview</span></button>
   <div class="navgap"></div>` +
  EPICS.map((e,i)=>{
    const has = epicHasPlans(e.code);
    const sub = has
      ? `<div class="gsub" id="gsub-${i+1}">` + e.phases.map((p,pi)=>{
          const pl = planFor(e.code,pi);
          return pl
            ? `<button class="subitem" data-plan="${pl.slug}" data-epic="${i+1}"><span class="pn">P${pi+1}</span><span class="tx">${p.t}</span><span class="rc">${pl.rounds}r</span></button>`
            : '';
        }).join('') + `</div>`
      : '';
    return `<div class="navgroup">
      <div class="ghead">
        <button class="gtoggle ${has?'':'spacer'}" data-toggle="${i+1}">▸</button>
        <button class="glabel ${has?'haskids':''}" data-go="${i+1}"><span class="n">${e.code}</span><span>${e.title}</span><span class="ph">${e.phases.length}</span></button>
      </div>${sub}
    </div>`;
  }).join('');

const planframe = document.getElementById('planframe');

function setActiveNav(n){
  document.querySelectorAll('#nav button[data-go]').forEach(b=>b.classList.toggle('active', +b.dataset.go===n));
  document.querySelectorAll('.subitem').forEach(s=>s.classList.remove('active'));
}
function expandGroup(n){
  const g=document.getElementById('gsub-'+n), t=document.querySelector('.gtoggle[data-toggle="'+n+'"]');
  if(g){g.classList.add('open'); if(t)t.classList.add('open');}
}
function go(n){
  document.body.classList.remove('viewing');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  const sec=document.getElementById('sec-'+n); if(sec) sec.classList.add('active');
  setActiveNav(n);
  if(n>0) expandGroup(n);   // reveal the epic's plans in the sidebar
  scroll.scrollTop=0;
}
function toggleGroup(n){
  const g=document.getElementById('gsub-'+n), t=document.querySelector('.gtoggle[data-toggle="'+n+'"]');
  if(!g) return;
  const open=g.classList.toggle('open'); if(t) t.classList.toggle('open',open);
}
function openPlan(slug, epicN){
  var th = window.__mdvTheme ? '#t='+window.__mdvTheme : '';   // seed theme so the iframe paints right
  planframe.src = PLAN_DIR+slug+'.html'+th;
  document.getElementById('planopen').href = PLAN_DIR+slug+'.html'+th;
  let meta=null, code='', title=slug;
  for(const c in PLANS){
    const idx=PLANS[c].findIndex(x=>x.slug===slug);
    if(idx>=0){ meta=PLANS[c][idx]; code=c+'·P'+(idx+1);
      const ep=EPICS.find(e=>e.code===c); if(ep) title=ep.phases[idx].t; break; }
  }
  document.getElementById('plancode').textContent=code;
  document.getElementById('plantitle').textContent=title;
  document.getElementById('planmeta').textContent=meta?('validated · '+meta.rounds+' rounds · '+meta.how):'';
  document.getElementById('planback').dataset.go=epicN||0;
  document.body.classList.add('viewing');
  if(epicN) expandGroup(epicN);
  document.querySelectorAll('.subitem').forEach(s=>s.classList.toggle('active', s.dataset.plan===slug));
  document.querySelector('main').scrollTop=0;
}
document.addEventListener('click',ev=>{
  const tog=ev.target.closest('[data-toggle]');
  if(tog){ toggleGroup(+tog.dataset.toggle); return; }
  const plan=ev.target.closest('[data-plan]');
  if(plan){ openPlan(plan.dataset.plan, +(plan.dataset.epic||0)); return; }
  const b=ev.target.closest('[data-go]'); if(!b) return;
  go(+b.dataset.go);
});

// deep-link: #plan=<slug> opens a viewer; #e<N> opens an epic
(function initHash(){
  const h=location.hash.replace('#','');
  if(h.startsWith('plan=')){ const slug=h.slice(5);
    for(const c in PLANS){ const idx=PLANS[c].findIndex(x=>x.slug===slug);
      if(idx>=0){ openPlan(slug, EPICS.findIndex(e=>e.code===c)+1); return; } } }
})();
</script>
<script>
/* dark / light / system theme. file:// frames don't share localStorage, so the open plan
   iframe is themed via a #t= url hint (flash-free on load) + postMessage (live on toggle). T cycles. */
(function(){
  var KEY="md-viewer-theme";
  var seg=[].slice.call(document.querySelectorAll("#themeSeg button"));
  var mq=window.matchMedia("(prefers-color-scheme: light)");
  var eff="dark";                                          // current resolved theme: "light" | "dark"
  function pref(){try{return localStorage.getItem(KEY)||"system";}catch(e){return "system";}}
  function postFrame(){
    var f=document.getElementById("planframe");
    if(f&&f.contentWindow){try{f.contentWindow.postMessage({type:"mdv-theme",theme:eff},"*");}catch(e){}}
  }
  function apply(p){
    eff=p==="system"?(mq.matches?"light":"dark"):p;
    window.__mdvTheme=eff;                                 // read by openPlan() to seed the iframe url
    document.documentElement.setAttribute("data-theme",eff);
    seg.forEach(function(b){b.classList.toggle("on",b.getAttribute("data-theme-choice")===p);});
    postFrame();
  }
  function set(p){try{localStorage.setItem(KEY,p);}catch(e){}apply(p);}
  function cycle(){var o=["light","dark","system"];set(o[(o.indexOf(pref())+1)%o.length]);}
  seg.forEach(function(b){b.addEventListener("click",function(){set(b.getAttribute("data-theme-choice"));});});
  if(mq.addEventListener)mq.addEventListener("change",function(){if(pref()==="system")apply("system");});
  else if(mq.addListener)mq.addListener(function(){if(pref()==="system")apply("system");});
  var frame=document.getElementById("planframe");
  if(frame)frame.addEventListener("load",postFrame);       // re-assert theme each time a plan loads
  document.addEventListener("keydown",function(e){
    var t=e.target.tagName;
    if(t==="TEXTAREA"||t==="INPUT"||e.target.isContentEditable)return;
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(e.key==="t"||e.key==="T")cycle();
  });
  apply(pref());
})();
</script>
